  const KIND_LABEL = { map: 'Map', plot: 'Plot', interactive: 'Interactive' };

  // ── State (persisted in the URL hash: #scale/site) ──
  // scale is null until the user picks National or Regional on the start page.
  // mScale is the National/Regional toggle inside the Matrix tab.
  const state = { scale: null, mScale: 'national', site: C.sites[0].id, dom: 'all', kind: 'all', q: '' };
  // Hash: #<scale>[/<site>] or #matrix/<national|regional>[/<site>], optionally followed by
  // ?product=<path>, ?table=<path> or ?record=<path> (path of the file) so an open window can be shared.
  let pendingOpen = null;  // { type, path } read from the hash, opened once the view has been drawn
  function readHash() {
    const raw = location.hash.slice(1);
    if (/^var-/.test(raw)) return;  // sidebar anchors only scroll the page
    const [view, query] = raw.split('?');
    pendingOpen = null;
    if (query) {
      const m = query.match(/^(product|table|record)=(.+)$/);
      if (m) { try { pendingOpen = { type: m[1], path: decodeURIComponent(m[2]) }; } catch (e) { pendingOpen = null; } }
    }
    let [hScale, hSite, hSite2] = view.split('/');
    if (hScale === 'matrix') {
      state.mScale = hSite === 'regional' ? 'regional' : 'national';
      hSite = hSite2;
    }
    state.scale = ['national', 'regional', 'matrix'].includes(hScale) ? hScale : null;
    if (C.sites.some(s => s.id === hSite)) state.site = hSite;
  }
  readHash();

  const missing = new Set();   // resolved paths that failed to load
  let viewList = [];            // products currently visible, for prev/next

  $('#bookLink').href = C.book;

  function resolve(path, product, siteId = state.site, scale = state.scale === 'matrix' ? state.mScale : state.scale) {
    if (scale === 'national' && product && product.sites && !product.sites.includes(siteId)) return null;
    const site = C.sites.find(s => s.id === siteId);
    let ok = true;
    const out = path.replace(/\{(\w+)\}/g, (_, k) => {
      if (C.roots[k]) return C.roots[k];
      const v = scale === 'national' ? site.tokens[k] : undefined;
      if (v === undefined) ok = false;
      return v || '';
    });
    return ok ? encodeURI(out) : null;
  }
  const bookUrl = p => C.book + p + '.html';

  function matches(group, ind, p) {
    if (state.dom !== 'all' && group.domain !== state.dom) return false;
    if (state.kind === 'enso' && !p.enso) return false;
    if (!['all', 'enso'].includes(state.kind) && p.kind !== state.kind) return false;
    if (state.q) {
      const hay = [group.variable, group.domain, ind.code, ind.name, p.title, p.caption, p.enso ? 'enso oni el niño la niña' : ''].join(' ').toLowerCase();
      if (!state.q.split(/\s+/).every(t => hay.includes(t))) return false;
    }
    return true;
  }

  function render() {
    const groups = C[state.scale];
    const site = C.sites.find(s => s.id === state.site);
    $('#scopePill').innerHTML = state.scale === 'national'
      ? `${ICONS.pin}National · ${esc(site.label)}` : `${ICONS.globe}Regional · Pacific basin`;

    viewList = [];
    let nInd = 0, nProd = 0, nAvail = 0;
    const toc = { Atmosphere: [], Ocean: [] };
    let html = '';

    groups.forEach((g, gi) => {
      let body = '';
      let gCount = 0;
      g.indicators.forEach((ind, ii) => {
        const projSrc = ind.projections || null;
        const hist = ind.products.filter(p => matches(g, ind, p));
        const proj = projSrc ? projSrc.products.filter(p => matches(g, ind, p)) : [];
        if (!hist.length && !proj.length) return;
        nInd++;
        let avail = 0;
        const card = (nb, part) => p => {
          nProd++;
          const url = resolve(p.path, p);
          remember(url, p, false, g, ind, part);
          const isMissing = !url || missing.has(url);
          if (!isMissing) { avail++; nAvail++; }
          const idx = isMissing ? -1 : viewList.push({ p, url, g, ind, nb }) - 1;
          const thumb = !url
            ? `<div class="thumb">Not available for this site</div>`
            : p.kind === 'interactive'
              ? `<div class="thumb iframe-thumb">${ICONS.chart}<span class="kind-tag">Interactive</span></div>`
              : `<div class="thumb"><img loading="lazy" src="${url}" alt="${esc(p.title)}" data-url="${url}"><span class="kind-tag">${KIND_LABEL[p.kind]}</span></div>`;
          return `<button type="button" class="card${isMissing ? ' missing' : ''}" data-idx="${idx}" ${isMissing ? 'tabindex="-1"' : ''}>
              ${missing.has(url) ? '<div class="thumb">Not generated yet</div>' : thumb}
              <div class="card-body">${esc(p.title)}</div></button>`;
        };
        const histCards = hist.map(card(ind.notebook, 'hist')).join('');
        const projCards = proj.map(card(projSrc && projSrc.notebook, 'proj')).join('');
        const total = hist.length + proj.length;
        gCount += total;

        const tablesOf = (list, part) => (state.kind === 'all' ? (list || []) : [])
          .map(t => ({ ...t, url: resolve(t.path, t) })).filter(t => t.url && tableOk(t.url))
          .map(t => { remember(t.url, t, true, g, ind, part); return t; });
        const tablesHtml = (tables, prefix) => tables.length
          ? `<div class="tables">${tables.map(t => `<button type="button" class="tbtn" data-csv="${t.url}" data-title="${esc(ind.name + ' — ' + prefix + t.title)}">${ICONS.table}${esc(t.title)}</button>`).join('')}</div>`
          : '';
        const tHist = tablesOf(ind.tables, 'hist');
        const tProj = tablesOf(projSrc && projSrc.tables, 'proj');
        const nTables = tHist.length + tProj.length;
        const badge = avail === total ? `<span class="badge ok">${avail} products</span>`
          : `<span class="badge warn">${avail} / ${total} available</span>`;

        const histBlock = hist.length
          ? `<div class="col-label"><span class="label-sm">Historical</span>
              <a href="${bookUrl(ind.notebook)}" target="_blank" rel="noopener">Open notebook ↗</a></div>
            <div class="grid">${histCards}</div>${tablesHtml(tHist, '')}`
          : ind.products.length ? '' : `<div class="proj"><span class="label-sm">Historical</span> Not available</div>`;
        const projBlock = !ind.projections
          ? `<div class="proj"><span class="label-sm">Projections</span> In development</div>`
          : proj.length
            ? `<div class="col-label" style="margin-top:16px"><span class="label-sm">Projections</span>
                <a href="${bookUrl(projSrc.notebook)}" target="_blank" rel="noopener">Open notebook ↗</a></div>
              <div class="grid">${projCards}</div>${tablesHtml(tProj, 'Projections · ')}`
            : '';

        body += `<article class="ind" id="ind-${gi}-${ii}">
          <div class="ind-head" role="button" tabindex="0" aria-expanded="true">
            <span class="code">${esc(ind.code)}</span><h3>${esc(ind.name)}</h3>
            <div class="ind-meta">${badge}${nTables ? `<span class="badge">${nTables} tables</span>` : ''}
              <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
          </div>
          <div class="ind-body">
            ${histBlock}
            ${projBlock}
          </div>
        </article>`;
      });
      if (!body) return;
      toc[g.domain].push(`<a href="#var-${gi}"><span class="var-icon" style="width:24px;height:24px;border-radius:6px">${ICONS[g.icon]}</span>${esc(g.variable)}<span class="n">${gCount}</span></a>`);
      html += `<section class="var ${g.domain}" id="var-${gi}">
        <div class="var-head"><div class="var-icon">${ICONS[g.icon]}</div>
          <h2>${esc(g.variable)}</h2><span class="dom">${g.domain}</span>
          <a class="book" href="${bookUrl(g.page)}" target="_blank" rel="noopener">Chapter in the book ↗</a></div>
        ${body}</section>`;
    });

    $('#main').innerHTML = html || '<div class="empty">No products match these filters.</div>';
    $('#toc').innerHTML = Object.entries(toc).filter(([, v]) => v.length)
      .map(([d, v]) => `<div class="grp ${d}"><div class="label-sm" style="padding:0 10px 4px">${d}</div>${v.join('')}</div>`).join('');
    $('#stats').innerHTML = `<span><b>${nInd}</b> indicators</span><span><b>${nAvail}</b>/${nProd} products available</span>`;

    // Flag figures that fail to load, then re-render once they have all settled.
    let pending = 0;
    document.querySelectorAll('#main img[data-url]').forEach(img => {
      if (img.complete && img.naturalWidth === 0 && img.src) { missing.add(img.dataset.url); pending = -1; }
      img.addEventListener('error', () => { missing.add(img.dataset.url); scheduleRerender(); }, { once: true });
    });
    if (pending < 0) scheduleRerender();
  }
  let rr;
  function scheduleRerender() { clearTimeout(rr); rr = setTimeout(render, 150); }

  // ── Modal ──
  const modal = $('#modal');
  let cur = -1;
  function openProduct(i) {
    if (i < 0 || i >= viewList.length) return;
    cur = i;
    const { p, url, g, ind, nb } = viewList[i];
    $('#mTitle').innerHTML = `${esc(p.title)}<span class="sub">${esc(g.variable)} · ${esc(ind.code)} ${esc(ind.name)}</span>`;
    $('#mStage').innerHTML = p.kind === 'interactive'
      ? `<iframe src="${url}" title="${esc(p.title)}"></iframe>`
      : `<img src="${url}" alt="${esc(p.title)}">`;
    $('#mCap').textContent = p.caption || '';
    $('#mActs').innerHTML = `
      <a class="btn" href="${url}" download>${ICONS.dl}Download</a>
      <a class="btn ghost" href="${url}" target="_blank" rel="noopener">${ICONS.ext}Open</a>
      <a class="btn ghost" href="${bookUrl(nb || ind.notebook)}" target="_blank" rel="noopener">${ICONS.book}Notebook</a>
      ${ctx.has(url) ? `<button type="button" class="btn ghost" data-rec="${url}">${ICONS.doc}Product record</button>` : ''}`;
    lastView = { type: 'product', i };
    $('#mCount').textContent = `${i + 1} / ${viewList.length}`;
    $('#mPrev').style.visibility = $('#mNext').style.visibility = '';
    $('#mActs').insertAdjacentHTML('beforeend', linkBtn());
    showModal();
    setOpenHash('product', url);
  }
  function openTable(url, title) {
    cur = -1;
    $('#mTitle').innerHTML = `${esc(title)}<span class="sub">${esc(decodeURI(url).split('/').pop())}</span>`;
    $('#mCount').textContent = '';
    $('#mPrev').style.visibility = $('#mNext').style.visibility = 'hidden';
    $('#mCap').textContent = '';
    $('#mActs').innerHTML = `<a class="btn" href="${url}" download>${ICONS.dl}Download CSV</a>
      ${ctx.has(url) ? `<button type="button" class="btn ghost" data-rec="${url}">${ICONS.doc}Product record</button>` : ''}`;
    lastView = { type: 'table', url, title };
    $('#mActs').insertAdjacentHTML('beforeend', linkBtn());
    $('#mStage').innerHTML = '<div class="msg">Loading…</div>';
    showModal();
    setOpenHash('table', url);
    const cached = tableCache.get(url);
    (cached && cached.data ? Promise.resolve(cached.data)
      : tableText(url).then(txt => { if (txt === '') throw new Error('unavailable'); return Papa.parse(txt.trim(), { skipEmptyLines: true }).data; })
    ).then(data => {
      const [head, ...rows] = data;
      const fmt = v => { const n = Number(v); return v !== '' && isFinite(n) && /\./.test(v) ? n.toFixed(3).replace(/\.?0+$/, '') : esc(v); };
      $('#mStage').innerHTML = `<div style="width:100%;overflow:auto;align-self:start"><table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map(fmt).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }).catch(() => {
      $('#mStage').innerHTML = `<div class="msg">The table could not be loaded. Rebuild <code>tables.js</code> (<code>build_tables_js.py</code>), serve the repository over HTTP
        (for example <code>python -m http.server</code> from the repository root) or use the download button.</div>`;
    });
  }
  // Tables are only listed once their CSV has been read and holds at least one value.
  // Each CSV is read once (from tables.js, or fetched over HTTP); unreadable or empty tables are hidden.
  const tableCache = new Map();  // url -> 'pending' | { ok, data }
  let tableTimer;
  function tableOk(url) {
    const c = tableCache.get(url);
    if (c === undefined) probeTable(url);
    return !!(c && c !== 'pending' && c.ok);
  }
  // CSV text: from tables.js (bundled by build_tables_js.py, works from file://) or fetched over HTTP.
  const BUNDLED = window.CINDRA_TABLES || {};
  function tableText(url) {
    const key = decodeURI(url);
    if (key in BUNDLED) return Promise.resolve(BUNDLED[key]);
    if (location.protocol === 'file:') return Promise.resolve('');
    return fetch(url).then(r => r.ok ? r.text() : '').catch(() => '');
  }
  function probeTable(url) {
    if (!window.Papa) { tableCache.set(url, { ok: false }); return; }
    tableCache.set(url, 'pending');
    tableText(url).then(txt => {
      const data = txt.trim() ? Papa.parse(txt.trim(), { skipEmptyLines: true }).data : [];
      const hasValue = v => v.trim() !== '' && !/^(nan|none|null|na)$/i.test(v.trim());
      const ok = data.length > 1 && data.slice(1).some(r => r.slice(r.length > 1 ? 1 : 0).some(hasValue));
      tableCache.set(url, { ok, data });
      clearTimeout(tableTimer);
      tableTimer = setTimeout(() => {
        if (state.scale === 'matrix') renderMatrix();
        else if (state.scale) render();
      }, 120);
    });
  }
  // ── Product records (CIndRA CMPLV "source of record") ──
  // Hand-written content: records.js (methods, limitations, sources, review). Automatic part: inventory.js
  // (run dates, file inventory, code version, local data copies; build_inventory_js.py). The context of every
  // product / table drawn on the page (indicator, historical or projection, scale, site) is kept in `ctx`.
  const REC = window.CINDRA_RECORDS || { sources: {}, indicators: {}, issues: {} };
  const INV = window.CINDRA_INVENTORY || null;
  const ctx = new Map();  // url -> { item, isTable, g, ind, part, scale, siteId }
  let lastView = null;    // view to return to from a record
  function remember(url, item, isTable, g, ind, part) {
    if (url) ctx.set(url, { item, isTable, g, ind, part, scale: state.scale === 'matrix' ? state.mScale : state.scale, siteId: state.site });
  }
  const fmtDate = s => s ? s.replace('T', ' ').slice(0, 16) : '—';
  const nowLocal = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
  const fmtSize = n => n == null ? '—' : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  const STAT = { pass: 'Passed', flag: 'Flagged', fail: 'Failed', info: 'Info' };

  function buildRecord(url) {
    const c = ctx.get(url);
    const { item, isTable, g, ind, part, scale, siteId } = c;
    const site = C.sites.find(s => s.id === siteId);
    const national = scale === 'national';
    const base = REC.indicators[ind.code] || {};
    const meta = part === 'proj' ? (base.projections || {}) : base;
    const pmeta = (meta.products || {})[item.title] || {};
    const tok = s => (s || '').replace(/\{site\}/g, national ? site.label : 'Pacific basin').replace(/\{station\}/g, national ? site.station : 'regional station set');
    const key = decodeURI(url);
    const file = INV && INV.files[key];
    const nb = part === 'proj' ? ind.projections && ind.projections.notebook : ind.notebook;

    // Supporting tables (the data behind the product) and their inventory entries.
    const tdefs = (part === 'proj' ? ind.projections && ind.projections.tables : ind.tables) || [];
    const tables = tdefs.filter(t => !t.enso || isTable || item.enso).map(t => {
      const u = resolve(t.path, t, siteId, scale);
      const k = u && decodeURI(u);
      return u && { title: t.title, url: u, key: k, file: INV && INV.files[k], info: INV && INV.tables[k], current: u === url };
    }).filter(Boolean);

    // Period: from this table, else from the supporting tables.
    const periods = (isTable ? tables.filter(t => t.current) : tables).map(t => t.info && t.info.period).filter(Boolean);
    const period = periods.length ? [Math.min(...periods.map(p => p[0])), Math.max(...periods.map(p => p[1]))] : null;

    // Data sources and the date of their local copy.
    const sources = (meta.sources || []).map(k => {
      const s = REC.sources[k] || { dataset: k };
      const copies = (s.copy || []).map(p => {
        let ok = true;
        const path = p.replace(/\{(\w+)\}/g, (_, t) => { const v = national ? site.tokens[t] : undefined; if (v === undefined) ok = false; return v || ''; });
        return ok ? { path, data: INV && INV.data[path] } : null;
      }).filter(Boolean);
      return { key: k, ...s, copies };
    });

    const code = ind.code;
    const packageId = `CIndRA-${national ? 'NAT' : 'REG'}-${national ? site.id : 'pacific'}-${code}-${part === 'proj' ? 'P' : 'H'}`;
    const productId = `${packageId}-${key.split('/').pop().replace(/\.[^.]+$/, '')}`;
    const issues = Object.entries(REC.issues || {}).filter(([, x]) =>
      (!x.codes || x.codes.includes(code)) && (!x.sites || (national && x.sites.includes(site.id)))).map(([id, x]) => ({ id, ...x }));
    const review = meta.review || { status: 'pending', notes: 'No review recorded.' };
    const repo = INV && INV.repo || {};

    // Validation record.
    const checks = [];
    const chk = (status, label, detail) => checks.push({ status, label, detail });
    if (!INV) chk('fail', 'Inventory', 'inventory.js not found: run build_inventory_js.py to record run dates, files and code version.');
    else chk(file ? 'pass' : 'fail', 'Product file', file ? `Found (${fmtSize(file.size)}, generated ${fmtDate(file.modified)}).` : 'Product file missing from the inventory.');
    chk(item.caption ? 'pass' : 'flag', 'Caption', item.caption ? 'Caption tied to the product.' : 'No caption for this product.');
    chk(meta.methods && meta.methodId ? 'pass' : 'flag', 'Methods note', meta.methods ? `Method ${meta.methodId || '(no ID)'} documented.` : 'Methods note not written yet (records.js).');
    chk(meta.limitations && meta.limitations.length ? 'pass' : 'flag', 'Limitations note', meta.limitations && meta.limitations.length ? `${meta.limitations.length} limitations documented.` : 'Limitations not written yet (records.js).');
    chk(pmeta.units || meta.units ? 'pass' : 'flag', 'Units', pmeta.units || meta.units || 'Units not declared.');
    chk(period ? 'pass' : 'flag', 'Period', period ? `${period[0]}–${period[1]} (from the supporting tables).` : 'Period not identified from the tables.');
    const srcOk = sources.length && sources.every(s => s.provider && s.version && s.url);
    chk(srcOk ? 'pass' : 'flag', 'Data sources', sources.length ? (srcOk ? `${sources.length} source(s) with provider, version and URL.` : 'Some sources lack provider, version or URL.') : 'No data source documented.');
    const copies = sources.flatMap(s => s.copies);
    const missingCopies = copies.filter(x => !x.data);
    chk(copies.length && !missingCopies.length ? 'pass' : 'flag', 'Source data copy',
      !copies.length ? 'Local copy of the source data not documented.' : missingCopies.length ? `Not found: ${missingCopies.map(x => x.path).join(', ')}` : `${copies.length} local file(s) found; dates recorded.`);
    chk(!repo.commit ? 'flag' : repo.dirty ? 'flag' : 'pass', 'Code version',
      !repo.commit ? 'No git commit recorded.' : repo.dirty ? `Commit ${repo.short} with uncommitted changes when the inventory was built: the outputs may not be reproducible from the commit alone.` : `Commit ${repo.short}, clean working tree.`);
    const tMissing = tables.filter(t => !t.file), tEmpty = tables.filter(t => t.info && !t.info.rows);
    chk(!tables.length ? 'flag' : tEmpty.length ? 'fail' : tMissing.length ? 'flag' : 'pass', 'Supporting tables',
      !tables.length ? 'No data table linked to this product.' : tEmpty.length ? `Empty: ${tEmpty.map(t => t.title).join(', ')}` : tMissing.length ? `Not generated: ${tMissing.map(t => t.title).join(', ')}` : `${tables.length} table(s) present with header and data rows.`);
    chk(meta.qc ? 'pass' : 'flag', 'QC traceability', meta.qc ? 'QC reference documented.' : 'QC reference not documented.');
    const open = issues.filter(x => x.status !== 'closed');
    chk(open.length ? 'flag' : 'pass', 'Issue log', open.length ? `Open: ${open.map(x => x.id).join(', ')}` : 'No open issues.');
    chk(review.status === 'approved' ? 'pass' : 'flag', 'Scientific review', review.status === 'approved' ? `Approved${review.by ? ' by ' + review.by : ''}${review.date ? ', ' + review.date : ''}.` : 'Human scientific review pending.');
    const worst = checks.some(x => x.status === 'fail') ? 'fail' : checks.some(x => x.status === 'flag') ? 'flag' : 'pass';
    const statusLabel = review.status === 'approved' && worst === 'pass' ? ['pass', 'Approved for report use']
      : review.status === 'approved' ? ['fail', 'Approval on hold: validation not passed']
      : review.status === 'in-review' ? ['info', 'In scientific review']
      : worst === 'fail' ? ['fail', 'Draft: validation failed']
      : !meta.methods || !(meta.limitations || []).length ? ['flag', 'Draft: record incomplete'] : ['flag', 'Generated: pending scientific review'];

    return {
      productId, packageId, title: item.title, kind: isTable ? 'Table (CSV)' : (KIND_LABEL[item.kind] || item.kind),
      indicator: `${code} ${ind.name}`, variable: `${g.domain} · ${g.variable}`,
      profile: `${national ? 'National' : 'Regional'} · ${part === 'proj' ? 'Projections' : 'Historical'}`,
      spatial: tok(meta.spatial) || (national ? `${site.label} (${site.station})` : 'Pacific basin'),
      period, units: pmeta.units || meta.units || '', runDate: file && file.modified,
      caption: item.caption || '', methodId: meta.methodId || '', methods: meta.methods || '', limitations: meta.limitations || [],
      parameters: meta.parameters || {}, qc: meta.qc || '', sources, issues, review, statusLabel, worst, checks,
      notebook: nb, notebookUrl: nb ? bookUrl(nb) : '', repo, workflow: REC.workflow || '', inventoryDate: INV && INV.generated,
      url, key, file, tables,
      outputs: [{ title: item.title, key, file }, ...tables.filter(t => !t.current).map(t => ({ title: t.title, key: t.key, file: t.file }))],
    };
  }

  function recordHtml(r) {
    const row = (k, v) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`;
    const repoLink = r.repo.commit ? `<a href="${esc(r.repo.remote)}/commit/${r.repo.commit}" target="_blank" rel="noopener">${esc(r.repo.short)}</a> (${esc(r.repo.branch)}, ${esc(fmtDate(r.repo.commitDate))})${r.repo.dirty ? ' · <span class="rstat flag">uncommitted changes</span>' : ''}` : '—';
    return `<div class="rec">
      <div class="cover">
        <div class="cover-head"><b>${esc(r.title)}<span class="muted" style="display:block;font-size:13px;font-weight:500">${esc(r.indicator)} · ${esc(r.variable)}</span></b>
          <span class="rstat ${r.statusLabel[0]}">${esc(r.statusLabel[1])}</span></div>
        <table>
          ${row('Product ID', `<code>${esc(r.productId)}</code>`)}
          ${row('Package ID', `<code>${esc(r.packageId)}</code>`)}
          ${row('Product profile', esc(r.profile) + ' · ' + esc(r.kind))}
          ${row('Spatial scope', esc(r.spatial))}
          ${row('Period', r.period ? `${r.period[0]}–${r.period[1]}` : '<span class="muted">Not identified</span>')}
          ${row('Units', r.units ? esc(r.units) : '<span class="muted">Not declared</span>')}
          ${row('Run date', esc(fmtDate(r.runDate)) + ' <span class="muted">(product file generated)</span>')}
          ${row('Review status', `${esc(r.statusLabel[1])}${r.review.notes ? ` <span class="muted">— ${esc(r.review.notes)}</span>` : ''}`)}
        </table>
      </div>

      <h5>Caption</h5>
      <p>${r.caption ? esc(r.caption) : '<span class="muted">No caption.</span>'}</p>

      <h5>Methods note ${r.methodId ? `<span class="eid">${esc(r.methodId)}</span>` : ''}</h5>
      ${r.methods ? `<p>${esc(r.methods)}</p>` : '<p class="muted">Not documented yet (matrix_cc/records.js).</p>'}
      <table>
        ${Object.entries(r.parameters).map(([k, v]) => row(k, esc(v))).join('')}
        ${r.qc ? row('QC reference', esc(r.qc)) : ''}
        ${row('Notebook', r.notebookUrl ? `<a href="${r.notebookUrl}" target="_blank" rel="noopener">${esc(r.notebook)}</a>` : '—')}
        ${row('Repository', r.repo.remote ? `<a href="${esc(r.repo.remote)}" target="_blank" rel="noopener">${esc(r.repo.remote)}</a>` : '—')}
      </table>

      <h5>Limitations note</h5>
      ${r.limitations.length ? `<ul>${r.limitations.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '<p class="muted">Not documented yet (matrix_cc/records.js).</p>'}
      ${r.issues.map(x => `<div class="issue"><b>${esc(x.id)}</b> · ${esc(x.title)} <span class="rstat ${x.status === 'closed' ? 'pass' : 'flag'}">${esc(x.status)}</span><br>${esc(x.text)}</div>`).join('')}

      <h5>Data tables</h5>
      ${r.tables.length ? `<div>${r.tables.map(t => `<button type="button" class="tbtn" data-rec-table="${t.url}" data-title="${esc(r.indicator + ' — ' + t.title)}">${ICONS.table}${esc(t.title)}${t.current ? ' (this table)' : ''}</button>`).join('')}</div>
        <p class="muted" style="font-size:12.5px">Tables computed with the same notebook run as this product.</p>` : '<p class="muted">No table linked to this indicator.</p>'}

      <h5>Metadata and provenance</h5>
      <table class="rtab">
        <thead><tr><th>Dataset</th><th>Provider</th><th>Version</th><th>Local copy (date)</th></tr></thead>
        <tbody>${r.sources.length ? r.sources.map(s => `<tr><td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.dataset)}</a>` : esc(s.dataset)}${s.citation ? `<br><span class="muted" style="font-size:12px">${esc(s.citation)}</span>` : ''}</td>
          <td>${esc(s.provider || '—')}</td><td>${esc(s.version || '—')}</td>
          <td>${s.copies.length ? s.copies.map(x => `<code>${esc(x.path.replace(/^\.\.\//, ''))}</code> ${x.data ? esc(fmtDate(x.data.modified)) : '<span class="rstat flag">not found</span>'}`).join('<br>') : '—'}</td></tr>`).join('')
          : '<tr><td colspan="4" class="muted">No data source documented yet.</td></tr>'}</tbody>
      </table>
      <table style="margin-top:10px">
        ${row('Code version', repoLink)}
        ${row('Workflow version', esc(r.workflow))}
        ${row('Record assembled', `${esc(fmtDate(nowLocal()))} <span class="muted">(inventory built ${esc(fmtDate(r.inventoryDate))})</span>`)}
      </table>
      <table class="rtab inv" style="margin-top:10px">
        <thead><tr><th>Output inventory</th><th>File</th><th>Generated</th><th>Size</th><th>SHA-256</th></tr></thead>
        <tbody>${r.outputs.map(o => `<tr><td>${esc(o.title)}</td><td><code>${esc(o.key.split('/').pop())}</code></td><td>${o.file ? esc(fmtDate(o.file.modified)) : '<span class="rstat fail">missing</span>'}</td>
          <td>${o.file ? fmtSize(o.file.size) : '—'}</td><td>${o.file ? `<code title="${o.file.sha256}">${o.file.sha256.slice(0, 12)}</code>` : '—'}</td></tr>`).join('')}</tbody>
      </table>

      <h5>Validation record <span class="rstat ${r.worst}">${STAT[r.worst]}</span></h5>
      <table class="chk">${r.checks.map(x => `<tr><td><span class="rstat ${x.status}">${STAT[x.status]}</span></td><th>${esc(x.label)}</th><td>${esc(x.detail)}</td></tr>`).join('')}</table>
    </div>`;
  }

  function recordMarkdown(r) {
    const L = [];
    L.push(`# Product record: ${r.title}`, '', `**${r.statusLabel[1]}**`, '');
    [['Product ID', r.productId], ['Package ID', r.packageId], ['Indicator', r.indicator], ['Variable', r.variable],
     ['Product profile', `${r.profile} · ${r.kind}`], ['Spatial scope', r.spatial], ['Period', r.period ? `${r.period[0]}–${r.period[1]}` : 'not identified'],
     ['Units', r.units || 'not declared'], ['Run date', fmtDate(r.runDate)], ['Review', `${r.review.status}${r.review.by ? ', ' + r.review.by : ''}${r.review.date ? ', ' + r.review.date : ''}${r.review.notes ? ' — ' + r.review.notes : ''}`]]
      .forEach(([k, v]) => L.push(`- **${k}:** ${v}`));
    L.push('', '## Caption', '', r.caption || '_No caption._', '', `## Methods note${r.methodId ? ` (${r.methodId})` : ''}`, '', r.methods || '_Not documented._', '');
    Object.entries(r.parameters).forEach(([k, v]) => L.push(`- **${k}:** ${v}`));
    if (r.qc) L.push(`- **QC reference:** ${r.qc}`);
    L.push(`- **Notebook:** ${r.notebookUrl || '—'}`, `- **Repository:** ${r.repo.remote || '—'}`, '', '## Limitations note', '');
    (r.limitations.length ? r.limitations : ['_Not documented._']).forEach(l => L.push(`- ${l}`));
    r.issues.forEach(x => L.push(`- **${x.id}** (${x.status}) ${x.title}: ${x.text}`));
    L.push('', '## Metadata and provenance', '', '| Dataset | Provider | Version | URL | Local copy |', '|---|---|---|---|---|');
    r.sources.forEach(s => L.push(`| ${s.dataset} | ${s.provider || ''} | ${s.version || ''} | ${s.url || ''} | ${s.copies.map(x => `${x.path} (${x.data ? fmtDate(x.data.modified) : 'not found'})`).join('; ')} |`));
    L.push('', `- **Code version:** ${r.repo.commit ? `${r.repo.commit} (${r.repo.branch})${r.repo.dirty ? ', uncommitted changes' : ''}` : '—'}`,
      `- **Workflow version:** ${r.workflow}`, `- **Inventory built:** ${fmtDate(r.inventoryDate)}`, '',
      '| Output | File | Generated | Size | SHA-256 |', '|---|---|---|---|---|');
    r.outputs.forEach(o => L.push(`| ${o.title} | ${o.key} | ${o.file ? fmtDate(o.file.modified) : 'missing'} | ${o.file ? fmtSize(o.file.size) : ''} | ${o.file ? o.file.sha256 : ''} |`));
    L.push('', `## Validation record: ${STAT[r.worst]}`, '', '| Status | Check | Detail |', '|---|---|---|');
    r.checks.forEach(x => L.push(`| ${STAT[x.status]} | ${x.label} | ${x.detail} |`));
    return L.join('\n') + '\n';
  }

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  let curRecord = null;
  function openRecord(url) {
    if (!ctx.has(url)) return;
    const r = curRecord = buildRecord(url);
    cur = -1;
    $('#mTitle').innerHTML = `Product record<span class="sub">${esc(r.title)} · ${esc(r.indicator)}</span>`;
    $('#mCount').textContent = '';
    $('#mPrev').style.visibility = $('#mNext').style.visibility = 'hidden';
    $('#mCap').textContent = 'Source-of-record information (CIndRA CMPLV): caption, methods, limitations, metadata, provenance and validation.';
    $('#mActs').innerHTML = `
      ${lastView ? `<button type="button" class="btn ghost" data-rec-back>${lastView.type === 'table' ? ICONS.table + 'Back to table' : ICONS.chart + 'Back to product'}</button>` : ''}
      <button type="button" class="btn" data-rec-dl="md">${ICONS.dl}Record (.md)</button>
      <button type="button" class="btn ghost" data-rec-dl="json">${ICONS.dl}Record (.json)</button>${linkBtn()}`;
    $('#mStage').innerHTML = recordHtml(r);
    $('#mStage').scrollTop = 0;
    showModal();
    setOpenHash('record', url);
  }
  $('#mActs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rec) return openRecord(b.dataset.rec);
    if ('copyLink' in b.dataset) return copyLink(b);
    if ('recBack' in b.dataset && lastView) return lastView.type === 'table' ? openTable(lastView.url, lastView.title) : openProduct(lastView.i);
    if (b.dataset.recDl && curRecord) {
      const name = curRecord.productId;
      if (b.dataset.recDl === 'md') download(`${name}_record.md`, recordMarkdown(curRecord), 'text/markdown');
      else { const { file, ...rest } = curRecord; download(`${name}_record.json`, JSON.stringify(rest, null, 2), 'application/json'); }
    }
  });

  function showModal() { modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
  function closeModal() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; $('#mStage').innerHTML = ''; setOpenHash(null); }

  // ── Shareable links ──
  // The address reflects the open product, table or record (replaceState: no extra history entries).
  function setOpenHash(type, url) {
    if (!state.scale) return;
    const q = type ? `?${type}=${encodeURIComponent(decodeURI(url))}` : '';
    history.replaceState(null, '', hashFor() + q);
  }
  const linkBtn = () => `<button type="button" class="btn ghost" data-copy-link title="Copy a link that opens this window">${ICONS.ext}Copy link</button>`;
  function copyLink(b) {
    const url = location.href;
    const done = () => { const t = b.innerHTML; b.textContent = 'Link copied ✓'; setTimeout(() => { b.innerHTML = t; }, 1600); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => prompt('Copy this link:', url));
    else prompt('Copy this link:', url);
  }
  // Open the product / table / record named in the hash once the view (and its tables) has been drawn.
  function restoreOpen(tries = 0) {
    if (!pendingOpen || !state.scale) return;
    const { type, path } = pendingOpen;
    const url = encodeURI(path);
    const c = ctx.get(url);
    if (!c) {
      if (tries < 25) return setTimeout(() => restoreOpen(tries + 1), 200);  // tables are read asynchronously
      pendingOpen = null;
      return setOpenHash(null);
    }
    pendingOpen = null;
    const nb = c.part === 'proj' && c.ind.projections ? c.ind.projections.notebook : c.ind.notebook;
    const showProduct = () => {
      let i = viewList.findIndex(v => v.url === url);
      if (i < 0) { viewList = [{ p: c.item, url, g: c.g, ind: c.ind, nb }]; i = 0; }
      openProduct(i);
    };
    const showTable = () => openTable(url, c.ind.name + ' — ' + c.item.title);
    if (type === 'record') { (c.isTable ? showTable : showProduct)(); openRecord(url); }
    else if (c.isTable) showTable();
    else showProduct();
  }

  // ── Events ──
  $('#main').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card && card.dataset.idx >= 0) return openProduct(+card.dataset.idx);
    const t = e.target.closest('.tbtn');
    if (t) return openTable(t.dataset.csv, t.dataset.title);
    const head = e.target.closest('.ind-head');
    if (head && !e.target.closest('a')) {
      const art = head.parentElement;
      art.classList.toggle('closed');
      head.setAttribute('aria-expanded', !art.classList.contains('closed'));
    }
  });
  $('#main').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ind-head')) { e.preventDefault(); e.target.click(); }
  });
  $('#mClose').onclick = closeModal;
  $('#mPrev').onclick = () => openProduct((cur - 1 + viewList.length) % viewList.length);
  $('#mNext').onclick = () => openProduct((cur + 1) % viewList.length);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (cur >= 0 && e.key === 'ArrowLeft') $('#mPrev').click();
    if (cur >= 0 && e.key === 'ArrowRight') $('#mNext').click();
  });

  const hashFor = () => {
    if (!state.scale) return location.pathname;
    if (state.scale === 'matrix') return `#matrix/${state.mScale}${state.mScale === 'national' ? '/' + state.site : ''}`;
    return `#${state.scale}${state.scale === 'national' ? '/' + state.site : ''}`;
  };
  // Leaving or returning to the start page adds a history entry, so the browser Back button works.
  function update(push = false) {
    history[push ? 'pushState' : 'replaceState'](null, '', hashFor());
    renderScope();
    if (state.scale === 'matrix') renderMatrix();
    else if (state.scale) { drawMap(); render(); }
    if (push || state.scale) window.scrollTo({ top: 0 });
  }
  window.addEventListener('popstate', () => {
    if (/^#var-/.test(location.hash)) return;
    readHash(); modal.classList.remove('open'); document.body.style.overflow = ''; update(); restoreOpen();
  });
  $('#homeBtn').onclick = $('#backBtn').onclick = () => { if (state.scale) { state.scale = null; update(true); } };
  function selectSite(id) { if (id !== state.site) { state.site = id; update(); } }
  $('#scaleTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.scale === state.scale) return;
    const fromStart = !state.scale;
    state.scale = b.dataset.scale; update(fromStart);
  });
  $('#scopeInfo').addEventListener('click', e => { const b = e.target.closest('.site-opt'); if (b) selectSite(b.dataset.site); });
  const chipGroup = (id, key) => $(id).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state[key] = b.dataset[key === 'dom' ? 'dom' : 'kind'];
    $(id).querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
    render();
  });
  chipGroup('#domChips', 'dom');
  chipGroup('#kindChips', 'kind');
  let qt;
  $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 120); });

  // Theme toggle (preference kept per browser)
  const root = document.documentElement;
  try { const t = localStorage.getItem('cindra-theme'); if (t) root.dataset.theme = t; } catch (_) {}
  $('#themeBtn').onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('cindra-theme', root.dataset.theme); } catch (_) {}
    drawMap();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawMap);

  // ── Scope card: site / region summary ──
  const productCount = siteId => {
    let n = 0;
    C.national.forEach(g => g.indicators.forEach(ind => [...ind.products, ...(ind.projections ? ind.projections.products : [])]
      .forEach(p => { if (resolve(p.path, p, siteId, 'national')) n++; })));
    return n;
  };
  const fmtLon = x => x <= 180 ? `${x.toFixed(2)}°E` : `${(360 - x).toFixed(2)}°W`;
  const fmtLat = y => `${Math.abs(y).toFixed(2)}°${y >= 0 ? 'N' : 'S'}`;
  const EEZ = window.CINDRA_EEZ || { features: [] };

  function renderScope() {
    document.body.dataset.scale = state.scale || 'none';
    if (!state.scale) {
      const count = groups => groups.reduce((n, g) => n + g.indicators.length, 0);
      $('#heroTitle').textContent = 'Pacific Islands Climate Indicator Product Repository';
      $('#heroText').textContent = 'Every figure and table produced by the CIndRA notebooks, organised by variable and indicator. Choose the scale and indicator you want to explore.';
      $('#metaNational').textContent = `${C.sites.length} sites · ${count(C.national)} indicators`;
      $('#metaRegional').textContent = `${(window.CINDRA_EEZ || { features: [] }).features.length} EEZs · ${count(C.regional)} indicators`;
      $('#metaMatrix').textContent = `${count(C.national) + count(C.regional)} indicators · national & regional`;
      document.querySelectorAll('#scaleTabs .scale-btn').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-selected', false); });
      return;
    }
    document.querySelectorAll('#scaleTabs .scale-btn').forEach(b => {
      b.classList.toggle('on', b.dataset.scale === state.scale);
      b.setAttribute('aria-selected', b.dataset.scale === state.scale);
    });
    if (state.scale === 'matrix') {
      $('#heroTitle').textContent = 'Product matrix';
      $('#heroText').textContent = 'One row per indicator. Active buttons show which maps, plots and tables are available for the historical period and projections; click one to open it.';
      return;
    }
    if (state.scale === 'national') {
      const s = C.sites.find(x => x.id === state.site);
      $('#heroTitle').textContent = 'National indicators';
      $('#heroText').textContent = 'Station-based atmosphere indicators and EEZ-scale ocean indicators for one country at a time. Pick a site on the map to see its products.';
      $('#scopeInfo').innerHTML = `
        <div><div class="scope-kicker">National scale · selected site</div><h2>${esc(s.label)}</h2></div>
        <dl><dt>Station</dt><dd>${esc(s.station)}</dd>
            <dt>Location</dt><dd>${fmtLat(s.lat)}, ${fmtLon(s.lon)}</dd>
            <dt>EEZ</dt><dd>${esc(s.eezName)}</dd>
            <dt>Products</dt><dd>${productCount(s.id)}</dd></dl>
        <div class="site-list">
          <span class="label-sm">Available sites</span>
          ${C.sites.map(x => `<button type="button" class="site-opt${x.id === s.id ? ' on' : ''}" data-site="${x.id}">
             <i class="dot"></i><span>${esc(x.label)}<small>${esc(x.station)} · ${productCount(x.id)} products</small></span></button>`).join('')}
        </div>
        <p class="hint">Click a highlighted EEZ or station on the map to switch site. Grey EEZs have no national products yet.</p>`;
    } else {
      const e = C.regionalExtent;
      let n = 0;
      C.regional.forEach(g => g.indicators.forEach(ind => { n += ind.products.length; }));
      $('#heroTitle').textContent = 'Regional indicators';
      $('#heroText').textContent = 'Basin-wide indicators for the Pacific: station networks, ERA5 and satellite fields mapped over the whole region and summarised for every EEZ.';
      $('#scopeInfo').innerHTML = `
        <div><div class="scope-kicker">Regional scale · study domain</div><h2>Pacific basin</h2></div>
        <dl><dt>Domain</dt><dd>${fmtLon(e.lonMin)} – ${fmtLon(e.lonMax)}<br>${fmtLat(e.latMin)} – ${fmtLat(e.latMax)}</dd>
            <dt>EEZs</dt><dd>${EEZ.features.length} Pacific EEZs</dd>
            <dt>Stations</dt><dd>GHCN-Daily inside the EEZs</dd>
            <dt>Gridded</dt><dd>ERA5 · NOAA OISST · Copernicus Marine · IBTrACS</dd>
            <dt>Products</dt><dd>${n}</dd></dl>
        <p class="hint">Regional products cover the whole domain outlined on the map. Hover an EEZ to see its name.</p>`;
    }
  }

  // ── Map ──
  let map, tiles, layers = [];
  const cssVar = n => getComputedStyle(document.body).getPropertyValue(n).trim();
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const tileUrl = () => 'https://server.arcgisonline.com/ArcGIS/rest/services/'
    + (isDark() ? 'Canvas/World_Dark_Gray_Base' : 'Ocean/World_Ocean_Base') + '/MapServer/tile/{z}/{y}/{x}';

  function drawMap() {
    if (!state.scale || state.scale === 'matrix') return;
    if (!window.L) { $('#map').innerHTML = '<p class="hint" style="padding:20px">The map needs an internet connection (Leaflet).</p>'; return; }
    if (!map) {
      map = L.map('map', { zoomSnap: 0.25, scrollWheelZoom: false, worldCopyJump: false }).setView([5, 170], 3);
      tiles = L.tileLayer(tileUrl(), { maxZoom: 10, attribution: 'Tiles &copy; Esri — GEBCO, NOAA, Garmin, HERE' }).addTo(map);
    }
    tiles.setUrl(tileUrl());
    layers.forEach(l => l.remove());
    layers = [];
    const accent = cssVar('--accent');
    const grey = isDark() ? '#6b7a8a' : '#94a3b3';

    if (state.scale === 'national') {
      const siteByEez = Object.fromEntries(C.sites.map(s => [s.eezName, s]));
      const styleFor = f => {
        const s = siteByEez[f.properties.name];
        if (!s) return { color: grey, weight: 0.8, fillColor: grey, fillOpacity: 0.05 };
        const on = s.id === state.site;
        return { color: accent, weight: on ? 2.5 : 1.4, fillColor: accent, fillOpacity: on ? 0.35 : 0.12 };
      };
      const eez = L.geoJSON(EEZ, {
        style: styleFor,
        onEachFeature: (f, l) => {
          const s = siteByEez[f.properties.name];
          l.bindTooltip(s ? `<b>${esc(s.label)}</b><br>${productCount(s.id)} products · click to select`
                          : `<b>${esc(f.properties.name)}</b><br>No national products yet`, { sticky: true });
          if (!s) return;
          l.on('click', () => selectSite(s.id));
          l.on('mouseover', () => l.setStyle({ weight: 3, fillOpacity: 0.45 }));
          l.on('mouseout', () => l.setStyle(styleFor(f)));
        },
      }).addTo(map);
      layers.push(eez);
      C.sites.forEach(s => {
        const on = s.id === state.site;
        const m = L.circleMarker([s.lat, s.lon], { radius: on ? 8 : 6, color: '#fff', weight: 2, fillColor: accent, fillOpacity: 1 })
          .bindTooltip(on ? `${esc(s.label)}` : `${esc(s.label)} — ${esc(s.station)}`,
                       on ? { permanent: true, direction: 'top', offset: [0, -8], className: 'site-label' } : { direction: 'top' })
          .on('click', () => selectSite(s.id)).addTo(map);
        layers.push(m);
      });
      const siteEez = eez.getLayers().filter(l => siteByEez[l.feature.properties.name]);
      const b = siteEez.length ? L.featureGroup(siteEez).getBounds() : eez.getBounds();
      map.fitBounds(b.pad(0.35));
    } else {
      const e = C.regionalExtent;
      const eez = L.geoJSON(EEZ, {
        style: { color: accent, weight: 1, fillColor: accent, fillOpacity: 0.22 },
        onEachFeature: (f, l) => {
          l.bindTooltip(`<b>${esc(f.properties.name)}</b>${f.properties.sovereign && f.properties.sovereign !== f.properties.name ? '<br>' + esc(f.properties.sovereign) : ''}`, { sticky: true });
          l.on('mouseover', () => l.setStyle({ weight: 2.5, fillOpacity: 0.45 }));
          l.on('mouseout', () => l.setStyle({ weight: 1, fillOpacity: 0.22 }));
        },
      }).addTo(map);
      const box = L.rectangle([[e.latMin, e.lonMin], [e.latMax, e.lonMax]],
        { color: accent, weight: 2, dashArray: '6 6', fill: false, interactive: false }).addTo(map);
      layers.push(eez, box);
      map.fitBounds(box.getBounds(), { padding: [10, 10] });
    }
  }

  // ── Matrix overview tab ──
  $('#mxSite').innerHTML = C.sites.map(s => `<option value="${s.id}">${esc(s.label)} — ${esc(s.station)}</option>`).join('');
  $('#mxLegend').innerHTML = `
    <span class="row" style="gap:6px"><span class="ico">${ICONS.map}</span>Available</span>
    <span class="row" style="gap:6px"><span class="ico off">${ICONS.map}</span>Not available</span>
    <span class="row" style="gap:6px">${ICONS.map.replace('<svg', '<svg width="15" height="15"')}Map</span>
    <span class="row" style="gap:6px">${ICONS.chart.replace('<svg', '<svg width="15" height="15"')}Plot</span>
    <span class="row" style="gap:6px">${ICONS.table.replace('<svg', '<svg width="15" height="15"')}Table</span>`;
  const MX_KINDS = [['map', 'Map', ICONS.map], ['plot', 'Plot', ICONS.chart], ['table', 'Table', ICONS.table]];

  function mxItems(ind, kind, part = 'hist') {
    const src = part === 'proj' ? ind.projections : ind;
    if (!src) return [];
    if (kind === 'table') {
      return (src.tables || []).filter(t => !t.enso).map(t => ({ t, url: resolve(t.path, t) })).filter(x => x.url && tableOk(x.url));
    }
    return src.products
      .filter(p => p.mx !== false && !p.enso)
      .filter(p => kind === 'plot' ? p.kind === 'plot' || p.kind === 'interactive' : p.kind === kind)
      .map(p => ({ p, url: resolve(p.path, p) })).filter(x => x.url && !missing.has(x.url));
  }

  function renderMatrix() {
    const ms = state.mScale;
    $('#mxScale').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === ms));
    $('#mxSiteWrap').style.display = ms === 'national' ? '' : 'none';
    $('#mxRegionNote').style.display = ms === 'national' ? 'none' : '';
    $('#mxSite').value = state.site;
    const cur = C.sites.find(s => s.id === state.site);
    $('#mxCurrent').innerHTML = ms === 'national'
      ? `Showing <b>National</b> products for <b>${esc(cur ? cur.label : state.site)}</b>`
      : `Showing <b>Regional</b> products for the <b>Pacific basin</b>`;
    const groups = C[ms];
    const domRows = {};
    groups.forEach(g => { domRows[g.domain] = (domRows[g.domain] || 0) + g.indicators.length; });
    const seenDom = new Set();
    let rows = '';
    groups.forEach((g, gi) => g.indicators.forEach((ind, ii) => {
      let tr = '<tr>';
      if (!seenDom.has(g.domain)) {
        seenDom.add(g.domain);
        tr += `<td rowspan="${domRows[g.domain]}" class="mx-dom ${g.domain}"><span>${g.domain}</span></td>`;
      }
      if (ii === 0) {
        tr += `<td rowspan="${g.indicators.length}" class="mx-var ${g.domain}"><a href="${bookUrl(g.page)}" target="_blank" rel="noopener">
          <span class="var-icon">${ICONS[g.icon]}</span>${esc(g.variable)}</a></td>`;
      }
      tr += `<td class="mx-ind"><span class="code">${esc(ind.code)}</span><a href="${bookUrl(ind.notebook)}" target="_blank" rel="noopener">${esc(ind.name)}</a></td>`;
      ['hist', 'proj'].forEach(part => MX_KINDS.forEach(([k, label, icon], j) => {
        const items = mxItems(ind, k, part);
        items.forEach(x => remember(x.url, x.p || x.t, !x.p, g, ind, part));
        const names = items.map(x => (x.p || x.t).title).join(', ');
        const offTitle = part === 'proj' && !ind.projections ? 'Projections: in development' : `No ${label.toLowerCase()} available`;
        tr += `<td class="mx-c${j === 0 ? ' first' : ''}">` + (items.length
          ? `<button type="button" class="ico" data-g="${gi}" data-i="${ii}" data-k="${k}" data-p="${part}" title="${esc(label)}: ${esc(names)}" aria-label="${esc(label)} (${items.length}) — ${esc(ind.name)}">${icon}${items.length > 1 ? `<span class="n">${items.length}</span>` : ''}</button>`
          : `<span class="ico off" title="${offTitle}">${icon}</span>`) + '</td>';
      }));
      rows += tr + '</tr>';
    }));
    $('#mxTable').innerHTML = `<table class="mx">
      <thead>
        <tr><th rowspan="2" colspan="2">Variable</th><th rowspan="2">Indicator</th><th colspan="3" class="grp">Historical</th><th colspan="3" class="grp">Projections</th></tr>
        <tr>${[0, 1].map(() => MX_KINDS.map(([, l], j) => `<th class="sub${j === 0 ? ' first' : ''}">${l}</th>`).join('')).join('')}</tr>
      </thead><tbody>${rows}</tbody></table>`;
  }

  function openTableList(items, ind, nb = ind.notebook) {
    cur = -1;
    $('#mTitle').innerHTML = `Tables<span class="sub">${esc(ind.code)} ${esc(ind.name)}</span>`;
    $('#mCount').textContent = '';
    $('#mPrev').style.visibility = $('#mNext').style.visibility = 'hidden';
    $('#mCap').textContent = 'Choose a table to view it.';
    $('#mActs').innerHTML = `<a class="btn ghost" href="${bookUrl(nb)}" target="_blank" rel="noopener">${ICONS.book}Notebook</a>`;
    $('#mStage').innerHTML = `<div class="tlist">${items.map(x => `<button type="button" class="tbtn" data-csv="${x.url}" data-title="${esc(ind.name + ' — ' + x.t.title)}">${ICONS.table}${esc(x.t.title)}</button>`).join('')}</div>`;
    showModal();
  }
  $('#mStage').addEventListener('click', e => {
    const t = e.target.closest('.tlist .tbtn'); if (t) return openTable(t.dataset.csv, t.dataset.title);
    const r = e.target.closest('[data-rec-table]'); if (r) openTable(r.dataset.recTable, r.dataset.title);
  });

  $('#mxTable').addEventListener('click', e => {
    const b = e.target.closest('button.ico'); if (!b) return;
    const g = C[state.mScale][+b.dataset.g], ind = g.indicators[+b.dataset.i];
    const part = b.dataset.p;
    const nb = part === 'proj' ? ind.projections.notebook : ind.notebook;
    const items = mxItems(ind, b.dataset.k, part);
    if (b.dataset.k === 'table') return items.length === 1 ? openTable(items[0].url, ind.name + ' — ' + items[0].t.title) : openTableList(items, ind, nb);
    viewList = items.map(x => ({ ...x, g, ind, nb }));
    openProduct(0);
  });
  $('#mxScale').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.m === state.mScale) return;
    state.mScale = b.dataset.m; update();
  });
  $('#mxSite').addEventListener('change', e => { state.site = e.target.value; update(); });

  update();
  restoreOpen();
})();
</script>
</body>
</html>
