<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacific Islands Climate Indicator Product Repository</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --border: #dde3ea;
    --text: #15202b;
    --muted: #5b6877;
    --accent: #0e7c86;
    --accent-soft: #d9f0f1;
    --atmo: #c2410c;
    --atmo-soft: #fdebdd;
    --ocean: #1d5fa8;
    --ocean-soft: #dde9f7;
    --warn: #8a6100;
    --warn-soft: #fbf0d3;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
    --radius: 14px;
    --reg-accent: #4f46e5;
    --reg-soft: #e7e6fd;
    --mat-accent: #b45309;
    --mat-soft: #fdf0dc;
    --mat-hero: linear-gradient(135deg, #1f2937 0%, #57534e 55%, #b45309 100%);
    --nat-hero: linear-gradient(135deg, #0b3d5c 0%, #0e7c86 55%, #3aa17e 100%);
    --reg-hero: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #7c3aed 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141b; --surface: #16202a; --surface-2: #1d2a36; --border: #2a3947;
      --text: #e6edf3; --muted: #93a3b3; --accent: #3cc3cc; --accent-soft: #123a3e;
      --atmo: #f59e62; --atmo-soft: #3a2517; --ocean: #6aa9ec; --ocean-soft: #16293e;
      --warn: #e6b94a; --warn-soft: #3a2f12;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --reg-accent: #a5a1ff; --reg-soft: #28264f; --mat-accent: #f5b454; --mat-soft: #3a2a12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e141b; --surface: #16202a; --surface-2: #1d2a36; --border: #2a3947;
    --text: #e6edf3; --muted: #93a3b3; --accent: #3cc3cc; --accent-soft: #123a3e;
    --atmo: #f59e62; --atmo-soft: #3a2517; --ocean: #6aa9ec; --ocean-soft: #16293e;
    --warn: #e6b94a; --warn-soft: #3a2f12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --reg-accent: #a5a1ff; --reg-soft: #28264f; --mat-accent: #f5b454; --mat-soft: #3a2a12;
  }
  body[data-scale="regional"] { --accent: var(--reg-accent); --accent-soft: var(--reg-soft); }
  body[data-scale="matrix"] { --accent: var(--mat-accent); --accent-soft: var(--mat-soft); }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 150px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }

  /* ── Header ── */
  .hero {
    background: var(--nat-hero); color: #fff; padding: 28px 16px 84px; transition: background .4s;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }
  .hero .wrap { padding: 0; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .08em; font-size: 13px; opacity: .85; text-transform: uppercase; }
  .hero h1 { margin: 14px 0 6px; font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.01em; }
  .hero p { margin: 0; max-width: 760px; opacity: .9; }
  .hero-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.14); color: #fff; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,.25); cursor: pointer;
  }
  .pill-link:hover { background: rgba(255,255,255,.24); text-decoration: none; }
  .notice { margin-top: 14px; display: inline-block; font-size: 12.5px; background: rgba(0,0,0,.18); padding: 4px 10px; border-radius: 6px; }

  body[data-scale="regional"] .hero { background: var(--reg-hero); }

  /* ── Scale switch (hero) ── */
  .scale-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 22px 0 22px; max-width: 1120px; }
  .scale-btn {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; cursor: pointer; padding: 14px 16px; border-radius: 14px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); color: #fff; transition: background .15s, transform .15s;
  }
  .scale-btn:hover { background: rgba(255,255,255,.16); }
  .scale-btn.on { background: #fff; color: #15202b; border-color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .scale-btn svg { width: 26px; height: 26px; flex: none; margin-top: 2px; }
  .scale-btn.on svg { color: var(--accent); }
  .scale-btn b { display: block; font-size: 16px; }
  .scale-btn small { display: block; font-size: 12.5px; opacity: .8; line-height: 1.4; margin-top: 2px; }
  .scale-btn.on small { opacity: .7; }

  .scale-meta, .scale-cta { display: none; }
  /* Inner pages: the scale cards live only on the start page; a back button replaces them */
  body:not([data-scale="none"]) .scale-switch { display: none; }
  .back-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .back-row .notice { margin-top: 0; }
  body[data-scale="none"] .back-btn { display: none; }
  .brand { background: none; border: 0; padding: 0; color: #fff; cursor: pointer; }

  /* ── Landing: nothing chosen yet ── */
  body[data-scale="none"] .hero {
    background: linear-gradient(120deg, #0b3d5c 0%, #0e7c86 38%, #3730a3 72%, #7c3aed 100%);
    min-height: 100vh; padding-bottom: 48px; display: flex; flex-direction: column;
  }
  body[data-scale="none"] .hero .wrap { width: 100%; flex: 1; display: flex; flex-direction: column; }
  body[data-scale="none"] .hero h1 { margin-top: 12vh; font-size: clamp(30px, 3.4vw, 44px); max-width: 1240px; }
  body[data-scale="none"] .hero p { font-size: 17px; }
  body[data-scale="none"] .notice { align-self: flex-start; }
  body[data-scale="none"] .scale-switch { max-width: 1240px; gap: 20px; margin: 36px 0 28px; }
  body[data-scale="none"] .scale-btn {
    flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 16px; background: rgba(255,255,255,.1);
    backdrop-filter: blur(6px);
  }
  body[data-scale="none"] .scale-btn:hover { background: #fff; color: #15202b; transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  body[data-scale="none"] .scale-btn[data-scale="national"]:hover svg { color: #0e7c86; }
  body[data-scale="none"] .scale-btn[data-scale="regional"]:hover svg { color: #4f46e5; }
  body[data-scale="none"] .scale-btn[data-scale="matrix"]:hover svg { color: #b45309; }
  body[data-scale="none"] .scale-btn svg { width: 28px; height: 28px; }
  body[data-scale="none"] .scale-btn b { font-size: 20px; }
  body[data-scale="none"] .scale-btn small { font-size: 13.5px; margin-top: 3px; }
  /* Landing layout: Matrix full width on top, National + Regional half each below */
  body[data-scale="none"] .scale-switch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  body[data-scale="none"] .scale-btn[data-scale="matrix"] {
    order: -1; grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 18px; padding: 20px 26px;
    background: linear-gradient(120deg, #312e81 0%, #4338ca 50%, #6d28d9 100%);
    border-color: rgba(255,255,255,.4); box-shadow: 0 10px 30px rgba(67,56,202,.4);
  }
  body[data-scale="none"] .scale-btn[data-scale="matrix"]:hover {
    background: linear-gradient(120deg, #3730a3 0%, #4f46e5 50%, #7c3aed 100%); color: #fff;
    box-shadow: 0 16px 38px rgba(79,70,229,.5);
  }
  body[data-scale="none"] .scale-btn[data-scale="matrix"]:hover svg { color: #fff; }
  body[data-scale="none"] .scale-btn[data-scale="matrix"] svg { width: 42px; height: 42px; }
  body[data-scale="none"] .scale-btn[data-scale="matrix"] b { font-size: 26px; }
  body[data-scale="none"] .scale-btn[data-scale="matrix"] small { font-size: 14.5px; opacity: .92; }
  @media (max-width: 900px) {
    body[data-scale="none"] .scale-switch { grid-template-columns: minmax(0, 1fr); }
    body[data-scale="none"] .scale-btn[data-scale="matrix"] { flex-direction: column; align-items: flex-start; padding: 16px 20px; }
  }
  body[data-scale="none"] .scale-meta { display: block; font-style: normal; font-size: 13px; opacity: .75; margin-top: 6px; }
  body[data-scale="none"] .scale-cta { display: inline-block; margin-top: 8px; font-weight: 600; font-size: 13.5px; }
  body[data-scale="none"] .scope,
  body[data-scale="none"] .matrix-view,
  body[data-scale="none"] .panel,
  body[data-scale="none"] .layout,
  body[data-scale="none"] footer { display: none; }

  /* ── Matrix overview tab (like the original CC_indicators matrix) ── */
  body[data-scale="matrix"] .hero { background: var(--mat-hero); }
  body[data-scale="matrix"] .scope,
  body[data-scale="matrix"] .panel,
  body[data-scale="matrix"] .layout { display: none; }
  .matrix-view { display: none; margin-top: -64px; position: relative; z-index: 5; margin-bottom: 40px; }
  body[data-scale="matrix"] .matrix-view { display: block; }
  .mx-pick {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 16px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px;
  }
  .mx-step { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .mx-step-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .mx-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; font-size: 12px; letter-spacing: 0; }
  .mx-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mx-opts button {
    display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--border); background: var(--surface-2); color: var(--muted); font: inherit; transition: border-color .15s, background .15s;
  }
  .mx-opts button:hover { border-color: var(--accent); }
  .mx-opts button svg { width: 24px; height: 24px; flex: none; }
  .mx-opts button b { display: block; font-size: 16px; color: var(--text); }
  .mx-opts button small { font-size: 12.5px; }
  .mx-opts button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  #mxSite { font-size: 16px; font-weight: 600; padding: 13px 14px; border: 2px solid var(--accent); border-radius: 12px; width: 100%; }
  .mx-domain { font-size: 15px; font-weight: 600; padding: 13px 14px; border-radius: 12px; background: var(--surface-2); }
  .mx-current { font-size: 14px; color: var(--muted); }
  .mx-current b { color: var(--text); }
  @media (max-width: 760px) { .mx-pick, .mx-opts { grid-template-columns: minmax(0, 1fr); } }
  .mx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .mx-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .mx-legend { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .mx-legend .ico { width: 24px; height: 24px; cursor: default; }
  .mx-legend .ico svg { width: 13px; height: 13px; }
  .mx-scroll { overflow-x: auto; }
  table.mx { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 860px; }
  .mx th {
    position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); z-index: 1;
  }
  .mx th.grp { text-align: center; border-left: 1px solid var(--border); }
  .mx th.sub { text-align: center; font-size: 10.5px; }
  .mx th.sub.first { border-left: 1px solid var(--border); }
  .mx td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .mx tr:hover td.mx-ind, .mx tr:hover td.mx-c { background: var(--surface-2); }
  .mx td.mx-dom { width: 44px; padding: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .mx td.mx-dom span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; padding: 10px 0; }
  .mx td.mx-dom.Atmosphere { background: var(--atmo-soft); color: var(--atmo); }
  .mx td.mx-dom.Ocean { background: var(--ocean-soft); color: var(--ocean); }
  .mx td.mx-var { width: 210px; font-weight: 600; border-right: 1px solid var(--border); }
  .mx td.mx-var a { color: var(--text); display: flex; gap: 10px; align-items: center; }
  .mx td.mx-var .var-icon { width: 30px; height: 30px; border-radius: 8px; }
  .mx td.mx-var .var-icon svg { width: 17px; height: 17px; }
  .mx td.mx-var.Atmosphere .var-icon { background: var(--atmo-soft); color: var(--atmo); }
  .mx td.mx-var.Ocean .var-icon { background: var(--ocean-soft); color: var(--ocean); }
  .mx td.mx-ind .code { display: inline-block; min-width: 42px; }
  .mx td.mx-ind a { color: var(--text); font-weight: 500; }
  .mx td.mx-ind a:hover { color: var(--accent); }
  .mx td.mx-c { text-align: center; width: 64px; }
  .mx td.mx-c.first { border-left: 1px solid var(--border); }
  .ico {
    position: relative; width: 34px; height: 34px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0;
    border: 1px solid transparent; background: var(--accent-soft); color: var(--accent); cursor: pointer; transition: background .15s, color .15s, transform .15s;
  }
  .ico svg { width: 17px; height: 17px; }
  .ico:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
  .ico.off { background: transparent; color: var(--muted); border: 1px dashed var(--border); opacity: .55; cursor: not-allowed; }
  .ico.off:hover { transform: none; background: transparent; color: var(--muted); }
  .ico .n {
    position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px;
    background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 17px; border: 2px solid var(--surface);
  }
  .tlist { display: flex; flex-wrap: wrap; gap: 10px; padding: 28px; justify-content: center; }
  .tlist .tbtn { background: #eef2f6; border-color: #dde3ea; color: #15202b; font-size: 14px; padding: 9px 14px; }
  .tlist .tbtn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Scope card (site / region + map) ── */
  .scope { margin-top: -64px; position: relative; z-index: 5; }
  .scope-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    display: grid; grid-template-columns: 340px minmax(0, 1fr); overflow: hidden;
  }
  .scope-info { padding: 20px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--border); }
  .scope-kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .scope-info h2 { margin: 2px 0 0; font-size: 26px; letter-spacing: -.01em; line-height: 1.15; }
  .scope-info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
  .scope-info dt { color: var(--muted); }
  .scope-info dd { margin: 0; font-weight: 500; }
  .site-list { display: flex; flex-direction: column; gap: 6px; }
  .site-opt {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; text-align: left;
  }
  .site-opt:hover { border-color: var(--accent); }
  .site-opt.on { background: var(--accent-soft); border-color: var(--accent); }
  .site-opt .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .site-opt span { font-size: 13.5px; font-weight: 600; }
  .site-opt small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
  #map { min-height: 380px; background: var(--surface-2); }
  .leaflet-container { font: 13px Inter, system-ui, sans-serif; }
  .leaflet-tooltip.site-label { background: var(--accent); color: #fff; border: 0; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .leaflet-tooltip.site-label::before { display: none; }
  @media (max-width: 900px) {
    .scope-card { grid-template-columns: minmax(0, 1fr); }
    .scope-info { border-right: 0; border-bottom: 1px solid var(--border); }
    #map { min-height: 300px; }
    .scale-switch { grid-template-columns: minmax(0, 1fr); }
  }

  /* ── Control panel ── */
  .panel {
    position: sticky; top: 0; z-index: 20; margin-top: 16px;
  }
  .scope-pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .scope-pill svg { width: 16px; height: 16px; }
  .panel-inner {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px; display: grid; gap: 10px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted);
  }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .search {
    flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface-2);
    border-radius: 10px; padding: 0 12px; min-width: 0;
  }
  .search input { border: 0; outline: 0; background: transparent; padding: 9px 0; width: 100%; color: var(--text); font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; border-radius: 999px;
    cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .label-sm { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  select {
    font: inherit; color: var(--text); background: var(--surface-2); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer;
  }
  .stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin-left: auto; }
  .stats b { color: var(--text); font-size: 15px; }

  /* ── Layout ── */
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; margin: 24px auto 40px; }
  nav.toc { position: sticky; top: 170px; align-self: start; font-size: 14px; }
  nav.toc .grp { margin-bottom: 14px; }
  nav.toc a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--text); }
  nav.toc a:hover { background: var(--surface-2); text-decoration: none; }
  nav.toc a .n { margin-left: auto; font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .seg button { padding: 7px 12px; }
    .panel { position: static; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    nav.toc { display: none; }
    .stats { margin-left: 0; }
  }

  /* ── Variable section ── */
  section.var { margin-bottom: 28px; }
  .var-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .var-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .var-icon svg { width: 22px; height: 22px; }
  .Atmosphere .var-icon { background: var(--atmo-soft); color: var(--atmo); }
  .Ocean .var-icon { background: var(--ocean-soft); color: var(--ocean); }
  .var-head h2 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .dom { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .Atmosphere .dom { background: var(--atmo-soft); color: var(--atmo); }
  .Ocean .dom { background: var(--ocean-soft); color: var(--ocean); }
  .var-head .book { margin-left: auto; font-size: 13px; font-weight: 500; }

  .ind {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
  }
  .ind-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; flex-wrap: wrap; user-select: none;
  }
  .ind-head:hover { background: var(--surface-2); }
  .code { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; color: var(--muted); min-width: 36px; }
  .ind-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .ind-meta { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .badge { padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 500; white-space: nowrap; }
  .badge.ok { background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .chev { transition: transform .2s; color: var(--muted); }
  .ind.closed .chev { transform: rotate(-90deg); }
  .ind.closed .ind-body { display: none; }
  .ind-body { padding: 4px 16px 16px; border-top: 1px solid var(--border); }
  .col-label { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; gap: 8px; flex-wrap: wrap; }
  .col-label a { font-size: 13px; font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card {
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface);
    cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; display: flex; flex-direction: column;
    text-align: left; padding: 0;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
  .thumb { aspect-ratio: 16 / 10; background: #fff; display: grid; place-items: center; overflow: hidden; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb.iframe-thumb { background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); color: var(--accent); }
  .thumb.iframe-thumb svg { width: 38px; height: 38px; }
  .kind-tag {
    position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    background: rgba(15,23,32,.72); color: #fff; padding: 2px 7px; border-radius: 5px;
  }
  .card-body { padding: 9px 11px 11px; font-size: 13px; font-weight: 500; line-height: 1.35; border-top: 1px solid var(--border); }
  .card.missing { cursor: default; opacity: .7; }
  .card.missing:hover { transform: none; box-shadow: none; border-color: var(--border); }
  .card.missing .thumb { background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 8px, var(--surface) 8px, var(--surface) 16px); color: var(--muted); font-size: 12px; }
  .card.missing .thumb img { display: none; }

  .tables { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-2);
    padding: 5px 11px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .tbtn:hover { border-color: var(--accent); color: var(--accent); }
  .tbtn svg { width: 14px; height: 14px; }

  .proj {
    margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--border);
    font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center;
  }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  /* ── Modal ── */
  .modal { position: fixed; inset: 0; z-index: 50; display: none; background: rgba(6,12,18,.72); backdrop-filter: blur(4px); padding: 16px; }
  .modal.open { display: grid; place-items: center; }
  .dialog {
    background: var(--surface); border-radius: 16px; width: min(1200px, 100%); max-height: calc(100vh - 32px);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .dialog-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .dialog-head h4 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
  .dialog-head .sub { font-size: 12.5px; color: var(--muted); font-weight: 500; display: block; }
  .iconbtn {
    border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
    display: grid; place-items: center; flex: none;
  }
  .iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
  .iconbtn svg { width: 18px; height: 18px; }
  .stage { background: #fff; overflow: auto; display: grid; place-items: center; min-height: 300px; }
  .stage img { max-width: 100%; max-height: calc(100vh - 220px); display: block; }
  .stage iframe { width: 100%; height: min(70vh, 640px); border: 0; background: #fff; }
  .stage table { border-collapse: collapse; font-size: 13px; color: #15202b; margin: 16px; }
  .stage th, .stage td { border: 1px solid #dde3ea; padding: 5px 10px; text-align: right; white-space: nowrap; }
  .stage th { background: #eef2f6; position: sticky; top: 0; }
  .stage td:first-child, .stage th:first-child { text-align: left; }
  .stage .msg { padding: 32px; color: #5b6877; text-align: center; max-width: 520px; }
  .dialog-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .dialog-foot .cap { flex: 1 1 380px; font-size: 13.5px; color: var(--muted); margin: 0; }
  .dialog-foot .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 9px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
  }
  .btn:hover { text-decoration: none; filter: brightness(1.08); }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn svg { width: 15px; height: 15px; }
  .counter { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Product record (CMPLV source-of-record) */
  .rec { align-self: start; width: 100%; max-width: 980px; margin: 0 auto; padding: 22px 26px 30px; color: #15202b; font-size: 14px; line-height: 1.5; }
  .rec h5 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0e7c86; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
  .rec h5 .eid { font-weight: 600; color: #5b6877; letter-spacing: .02em; text-transform: none; font-size: 12px; }
  .rec p { margin: 0 0 8px; }
  .rec ul { margin: 0 0 8px; padding-left: 20px; }
  .rec li { margin: 2px 0; }
  .rec .muted { color: #5b6877; }
  .rec code { font-size: 12px; background: #eef2f6; padding: 1px 5px; border-radius: 5px; word-break: break-all; }
  .rec table { margin: 0; width: 100%; border-collapse: collapse; font-size: 13px; }
  .rec th, .rec td { text-align: left !important; white-space: normal; vertical-align: top; border: 1px solid #dde3ea; padding: 6px 10px; }
  .rec th { position: static; width: 210px; font-weight: 600; background: #f5f7fa; }
  .rec table.rtab th { width: auto; background: #eef2f6; }
  .rec table.inv { table-layout: fixed; }
  .rec table.inv th:nth-child(1) { width: 22%; } .rec table.inv th:nth-child(2) { width: 42%; }
  .rec table.inv th:nth-child(3) { width: 15%; } .rec table.inv th:nth-child(4) { width: 8%; } .rec table.inv th:nth-child(5) { width: 13%; }
  .rec .cover { border: 1px solid #dde3ea; border-radius: 12px; overflow: hidden; }
  .rec .cover-head { padding: 14px 16px; background: #f5f7fa; border-bottom: 1px solid #dde3ea; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .rec .cover-head b { font-size: 16px; flex: 1 1 300px; }
  .rec .cover table th, .rec .cover table td { border-width: 0 0 1px 0; }
  .rec .cover table tr:last-child th, .rec .cover table tr:last-child td { border-bottom: 0; }
  .rstat { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .rstat.pass { background: #dcf3e4; color: #17633a; }
  .rstat.flag { background: #fdf0d2; color: #835c00; }
  .rstat.fail { background: #fbdcdc; color: #9b1c1c; }
  .rstat.info { background: #e3ecf7; color: #234e85; }
  .rec .chk td:first-child { width: 92px; }
  .rec .tbtn { margin: 0 6px 6px 0; }
  .rec .issue { border-left: 3px solid #d39b00; background: #fffaf0; padding: 8px 12px; border-radius: 0 8px 8px 0; margin-bottom: 8px; }

  footer { border-top: 1px solid var(--border); padding: 20px 16px; text-align: center; font-size: 13px; color: var(--muted); }
</style>
</head>

<script>
(() => {
  const C = window.CINDRA;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const ICONS = {
    thermo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0Z"/></svg>',

    tide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M2 21c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M12 12V3"/><path d="m8.5 6.5 3.5-3.5 3.5 3.5"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 20A7 7 0 0 1 4 13c0-6 5-9 16-9 0 11-3 16-9 16Z"/><path d="M4 21c4-5 8-8 12-10"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></svg>',
    table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h14"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 3.8 5.8 3.8 9s-1.3 6.2-3.8 9c-2.5-2.8-3.8-5.8-3.8-9S9.5 5.8 12 3Z"/></svg>',
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
